<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>al-Kubrā fī an-Naḥw — Daram</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  .layout { display:grid; grid-template-columns:340px 1fr; align-items:start; gap:0;
    max-width:1560px; margin:0 auto; }

  /* ── table of contents (sidebar) ── */
  .toc { position:sticky; top:53px; align-self:start; height:calc(100vh - 53px); overflow-y:auto;
    border-right:1px solid var(--border-soft); background:var(--surface); padding:26px 22px 60px; order:1; }
  .toc .book-head { margin-bottom:22px; padding-bottom:20px; border-bottom:1px solid var(--border-soft); text-align:center; }
  .toc .book-head .ar-title { font-family:var(--heading-ar); font-size:2.1rem; color:var(--red); line-height:1.4; }
  .toc .book-head .en-title { font-family:var(--serif); font-style:italic; font-size:.9rem; color:var(--ink-muted); margin-top:4px; }
  .toc .book-head .author { font-family:var(--serif); font-size:.82rem; color:var(--ink-soft); margin-top:8px; direction:rtl; }

  .toc .grp { margin-bottom:6px; }
  .toc .grp-h { display:flex; align-items:baseline; gap:8px; direction:rtl; padding:12px 6px 6px; }
  .toc .grp-h .ar { font-family:var(--heading-ar); font-size:1.18rem; color:var(--ink); }
  .toc .grp-h .en { font-family:var(--serif); font-style:italic; font-size:.72rem; color:var(--ink-soft); direction:ltr; margin-right:auto; }

  .toc .item { display:flex; align-items:center; gap:8px; direction:rtl; width:100%;
    padding:9px 12px; border:none; background:none; text-align:right; cursor:pointer; border-radius:var(--r-md);
    font:inherit; transition:background var(--fast) var(--ease); }
  .toc .item:hover { background:var(--bg-deep); }
  .toc .item .ar { font-family:var(--body-ar); font-size:1.18rem; color:var(--ar-ink); line-height:1.5; flex:1; }
  .toc .item .pg { font-family:var(--serif); font-style:italic; font-size:.74rem; color:var(--ink-soft); direction:ltr; }
  .toc .item.ready .ar { color:var(--ink); }
  .toc .item:not(.ready) { cursor:default; opacity:.62; }
  .toc .item:not(.ready):hover { background:none; }
  .toc .item.active { background:var(--gold-soft); box-shadow:inset 3px 0 0 var(--gold); }
  .toc .item .dot { width:6px; height:6px; border-radius:50%; background:var(--green); flex:none; }
  .toc .item:not(.ready) .dot { background:var(--border-strong); }

  /* ── topbar toggle switch ── */
  .switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
  .switch input { position:absolute; opacity:0; width:0; height:0; }
  .switch .track { width:38px; height:22px; border-radius:999px; background:var(--bg-deep);
    border:1px solid var(--border); position:relative; transition:background var(--fast) var(--ease), border-color var(--fast) var(--ease); }
  .switch .thumb { position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:var(--raised); box-shadow:var(--sh-sm); transition:left var(--fast) var(--ease); }
  .switch input:checked + .track { background:var(--gold); border-color:var(--gold); }
  .switch input:checked + .track .thumb { left:18px; }
  .switch .switch-lbl { font-family:var(--sans); font-size:.82rem; color:var(--ink-muted); white-space:nowrap; }

  /* ── line-by-line translation ── */
  .line { margin:0; }
  .line-block { margin:0 0 1.6rem; }
  .box .line-block { margin:0 0 .55rem; }
  .box .line-block:last-child { margin-bottom:0; }
  .line-tr { display:none; font-family:var(--serif); font-size:.92rem; line-height:1.55;
    color:var(--ink-muted); direction:ltr; text-align:left; margin-top:7px; padding-left:12px;
    border-left:2px solid var(--gold-line); }
  body.show-tr .line-tr { display:block; }

  /* ── reading area ── */
  .read { order:2; padding:30px 24px 120px; min-width:0; }
  .chapter-bar { max-width:840px; margin:0 auto 18px; display:flex; align-items:baseline; gap:12px;
    direction:ltr; font-family:var(--serif); font-style:italic; color:var(--ink-soft); font-size:.85rem; flex-wrap:wrap; }
  .chapter-bar .pip { width:4px; height:4px; border-radius:50%; background:var(--ink-soft); align-self:center; }

  .hint { max-width:840px; margin:18px auto 0; text-align:center; direction:ltr;
    font-family:var(--sans); font-size:.78rem; color:var(--ink-soft); }

  /* ── desktop: collapsible contents sidebar ── */
  .toc .item.toc-toggle { justify-content:space-between; opacity:1; cursor:pointer;
    margin-bottom:6px; padding-bottom:12px; border-bottom:1px solid var(--border-soft); border-radius:0; }
  .toc .item.toc-toggle:hover { background:var(--bg-deep); }
  .toc .item.toc-toggle .ar { font-family:var(--sans); font-size:.82rem; letter-spacing:.02em;
    color:var(--ink-muted); flex:1; }
  .toc .item.toc-toggle .chev { font-family:var(--sans); font-size:1.1rem; line-height:1; flex:none;
    color:var(--ink-soft); transition:transform var(--fast) var(--ease); }
  @media (min-width:901px) {
    /* topbar “☰ Contents” fully hides the column to reclaim all its space */
    .layout.toc-hidden { grid-template-columns:1fr; }
    .layout.toc-hidden > .toc { display:none; }
    .layout.toc-collapsed { grid-template-columns:48px 1fr; }
    .layout.toc-collapsed .toc { padding:20px 6px 60px; overflow:hidden; }
    .layout.toc-collapsed .toc .book-head,
    .layout.toc-collapsed .toc #toc-list { display:none; }
    .layout.toc-collapsed .toc .item.toc-toggle { justify-content:center; border-bottom:none; padding:6px 0; }
    .layout.toc-collapsed .toc .item.toc-toggle .ar { display:none; }
    .layout.toc-collapsed .toc .item.toc-toggle .chev { transform:rotate(180deg); }
  }

  /* mobile: TOC becomes an off-canvas drawer */
  .toc-toggle { display:none; }
  .nav-toggle { display:inline-flex; align-items:center; gap:6px; background:none; cursor:pointer; }
  .toc-backdrop { display:none; }
  @media (max-width:900px) {
    .layout { grid-template-columns:1fr; }
    .read { order:1; padding:22px 16px 100px; }
    .topbar .crumb { display:none; }

    .toc { position:fixed; inset:0 0 0 auto; height:100dvh; width:min(360px,86vw);
      z-index:60; order:0; border-right:none; border-left:1px solid var(--border-soft);
      box-shadow:-10px 0 30px rgba(0,0,0,.20); padding-top:20px;
      transform:translateX(100%); transition:transform .28s var(--ease); }
    .toc.open { transform:translateX(0); }
    .toc .toc-toggle { display:none; }
    .toc.collapsed .grp, .toc.collapsed .book-head { display:block; }

    .toc-backdrop { display:block; position:fixed; inset:0; z-index:55;
      background:rgba(20,16,10,.44); opacity:0; pointer-events:none;
      transition:opacity .28s var(--ease); }
    .toc-backdrop.show { opacity:1; pointer-events:auto; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html">← Library</a>
    <button class="back nav-toggle" id="navToggle" aria-label="Open contents">☰ Contents</button>
    <span class="spacer"></span>
    <span class="crumb">al-Kubrā fī an-Naḥw</span>
    <label class="switch" title="Show an English translation beneath every line">
      <input type="checkbox" id="tr-toggle" />
      <span class="track"><span class="thumb"></span></span>
      <span class="switch-lbl">Line translation</span>
    </label>
  </div>

  <div class="toc-backdrop" id="tocBackdrop"></div>

  <div class="layout">
    <!-- reading pane -->
    <main class="read">
      <div class="chapter-bar" id="crumb"></div>
      <div id="page" class="page"></div>
      <p class="hint">Hover or tap any word for its translation · Esc or tap away to dismiss</p>
    </main>

    <!-- table of contents -->
    <aside class="toc" id="toc">
      <div class="book-head">
        <div class="ar-title">الكُبْرى في النَّحْو</div>
        <div class="en-title">al-Kubrā fī an-Naḥw</div>
        <div class="author">هاشم بن إسماعيل محمد البريدوسي</div>
      </div>
      <button class="item toc-toggle" title="Collapse / expand contents"
              onclick="this.closest('.layout').classList.toggle('toc-collapsed')">
        <span class="ar">المحتويات — Contents</span>
        <span class="chev" aria-hidden="true">‹</span>
      </button>
      <div id="toc-list"></div>
    </aside>
  </div>

  <div class="pop" id="pop" role="tooltip">
    <div class="p-ar"></div><div class="p-tr"></div><div class="p-en"></div><div class="p-note"></div>
  </div>

<script src="../../shared/core.js"></script>
<script src="../../shared/blocks.js"></script>
<script src="../../reader.js?v=3"></script>
<script src="muqaddimah.js"></script>
